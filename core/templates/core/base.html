<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if refresh %}<meta http-equiv="refresh" content="5">{% endif %}
  <title>{% block title %}Canteen Kiosk{% endblock %}</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#f4f5f7;color:#1c2430}
    header{background:#1f3a5f;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
    header a,header button{color:#fff;background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline}
    main{max-width:860px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    input[type=text],input[type=password],input[type=number]{font-size:1.1rem;padding:10px;border:1px solid #b8c0cc;border-radius:8px;width:100%;box-sizing:border-box}
    input[type=number]{width:80px}
    .btn{font-size:1.05rem;padding:11px 18px;border:0;border-radius:8px;background:#1f6fd1;color:#fff;cursor:pointer}
    .btn.secondary{background:#5b6675}
    .error{background:#fde8e8;color:#8a1f1f;padding:10px 14px;border-radius:8px;margin-bottom:12px}
    .ok{background:#e6f6ea;color:#1d5c2e;padding:10px 14px;border-radius:8px}
    table{width:100%;border-collapse:collapse}
    td,th{padding:8px;border-bottom:1px solid #e3e6ea;text-align:left}
    .big{font-size:2.2rem;font-weight:700}
    .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .status{display:inline-block;padding:3px 10px;border-radius:999px;background:#e8eefb;font-weight:600}
    @media(max-width:760px){.cols{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><strong>Canteen Kiosk</strong><span>{% block nav %}{% endblock %}</span></header>
<main>
  {% for m in messages %}<div class="error">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
